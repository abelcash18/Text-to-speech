<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modern Text To Speech</title> 
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%236366f1'/><stop offset='100%' stop-color='%23a855f7'/></linearGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)'/><path d='M35 30 L35 70 L50 70 L68 85 L68 15 L50 30 Z' fill='white'/><path d='M75 38 A 15 15 0 0 1 75 62' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
  </head>

  <body class="bg-4k">
    <div class="bg-overlay"></div>
    <div class="container py-5 main-content">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
              <h2 class="text-center mb-4 fw-bold text-gradient">Text To Speech</h2>
              <!-- Text Area -->
              <div class="form-floating mb-3">
                <textarea class="form-control" placeholder="Enter text here..." id="textArea" style="height: 140px"></textarea>
                <label for="textArea">Type or paste text here...</label>
              </div>

              <!-- Voice Selection -->
              <div class="mb-3">
                <label for="voiceSelect" class="form-label fw-semibold">Choose Voice</label>
                <select id="voiceSelect" class="form-select">
                  <option selected disabled>Loading voices...</option>
                </select>
              </div>

              <!-- Controls: Speed & Pitch -->
              <div class="row g-3 mb-4">
                <div class="col-6">
                  <label for="rate" class="form-label fw-semibold">Speed: <span id="rateValue">1</span>x</label>
                  <input type="range" class="form-range" id="rate" min="0.5" max="2" value="1" step="0.1">
                </div>
                <div class="col-6">
                  <label for="pitch" class="form-label fw-semibold">Pitch: <span id="pitchValue">1</span></label>
                  <input type="range" class="form-range" id="pitch" min="0.5" max="2" value="1" step="0.1">
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-outline-secondary w-100 w-md-auto" id="stopBtn" disabled>Stop</button>
                <button type="button" class="btn btn-primary w-100 w-md-auto" id="speakBtn">Speak Text</button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Application Logic -->
    <script src="script.js"></script>
  </body>
</html>
