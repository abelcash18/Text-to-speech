<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modern Text-to-Speech</title>
  <link rel="stylesheet" href="index.css">
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">Text To Speech</h2>

              <!-- Text Area -->
              <div class="form-floating mb-3">
                <textarea class="form-control" placeholder="Enter text here..." id="textArea" style="height: 150px"></textarea>
                <label for="textArea">Type or paste text here...</label>
              </div>

              <!-- Voice Selection -->
              <div class="mb-3">
                <label for="voiceSelect" class="form-label fw-semibold">Choose Voice</label>
                <select id="voiceSelect" class="form-select">
                  <option selected disabled>Loading voices...</option>
                </select>
              </div>

              <!-- Controls: Speed & Pitch -->
              <div class="row g-3 mb-4">
                <div class="col-6">
                  <label for="rate" class="form-label fw-semibold">Speed: <span id="rateValue">1</span>x</label>
                  <input type="range" class="form-range" id="rate" min="0.5" max="2" value="1" step="0.1">
                </div>
                <div class="col-6">
                  <label for="pitch" class="form-label fw-semibold">Pitch: <span id="pitchValue">1</span></label>
                  <input type="range" class="form-range" id="pitch" min="0.5" max="2" value="1" step="0.1">
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-outline-secondary w-100 w-md-auto" id="stopBtn" disabled>Stop</button>
                <button type="button" class="btn btn-primary w-100 w-md-auto" id="speakBtn">Speak Text</button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
